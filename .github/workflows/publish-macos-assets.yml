name: Publish Existing Signed Mac Builds

on:
  workflow_dispatch:
    inputs:
      staging_tag:
        description: Draft release containing the signed Mac ZIPs
        required: true
        type: string
      release_tag:
        description: Existing public release to receive the Mac ZIPs
        required: true
        default: v0.2.4
        type: string
      arm64_sha256:
        description: SHA-256 of the signed Apple Silicon ZIP
        required: true
        type: string
      x86_64_sha256:
        description: SHA-256 of the signed Intel ZIP
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-macos-assets
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      STAGING_TAG: ${{ inputs.staging_tag }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      ARM64_SHA256: ${{ inputs.arm64_sha256 }}
      X86_64_SHA256: ${{ inputs.x86_64_sha256 }}
    steps:
      - name: Download and verify the staged builds
        shell: bash
        run: |
          set -euo pipefail
          [[ "$STAGING_TAG" =~ ^macos-upload-[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$ARM64_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$X86_64_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ $(gh release view "$STAGING_TAG" --json isDraft --jq .isDraft) == true ]]
          [[ $(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft) == false ]]
          mkdir assets
          for arch in arm64 x86_64; do
            name="webrtc_vst-$RELEASE_TAG-macos-$arch-signed.zip"
            gh release download "$STAGING_TAG" --pattern "$name" --dir assets
            expected=$ARM64_SHA256
            if [[ "$arch" == x86_64 ]]; then expected=$X86_64_SHA256; fi
            printf '%s  %s\n' "$expected" "assets/$name" | shasum -a 256 --check
            ditto -x -k "assets/$name" "verify-$arch"
            bundle="verify-$arch/webrtc_vst.vst3"
            codesign --verify --strict --verbose=2 "$bundle"
            signature=$(codesign -dvv "$bundle" 2>&1)
            [[ "$signature" == *"Authority=Developer ID Application:"* ]]
            [[ "$signature" == *"TeamIdentifier=H3CKR5XB3J"* ]]
            [[ "$signature" == *"Timestamp="* ]]
            [[ $(lipo -archs "$bundle/Contents/MacOS/webrtc_vst") == "$arch" ]]
          done

      - name: Submit both signed ZIPs to VirusTotal
        shell: bash
        env:
          VIRUSTOTAL_API_KEY: ${{ secrets.VIRUSTOTAL_API_KEY || secrets.VT_API_KEY }}
        run: |
          set -euo pipefail
          : "${VIRUSTOTAL_API_KEY:?Missing VirusTotal API key}"
          for arch in arm64 x86_64; do
            file="assets/webrtc_vst-$RELEASE_TAG-macos-$arch-signed.zip"
            response=$(curl --fail-with-body --silent --show-error \
              --request POST --url https://www.virustotal.com/api/v3/files \
              --header "x-apikey: $VIRUSTOTAL_API_KEY" --form "file=@$file")
            analysis_id=$(jq -er '.data.id' <<< "$response")
            # Analysis URLs remain in the workflow log, never in public release notes.
            echo "Submitted $arch: https://www.virustotal.com/gui/file-analysis/$analysis_id"
          done

      - name: Attach verified builds to the existing release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$RELEASE_TAG" \
            "assets/webrtc_vst-$RELEASE_TAG-macos-arm64-signed.zip" \
            "assets/webrtc_vst-$RELEASE_TAG-macos-x86_64-signed.zip"
